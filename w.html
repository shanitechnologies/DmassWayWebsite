    <script>
        /** Preloader Logic: Enforces Minimum Timer (1200ms) for Glitch Prevention */
        const initTime = Date.now();
        window.addEventListener('load', () => {
            const elapsed = Date.now() - initTime;
            const minTime = 1200;
            const delay = Math.max(0, minTime - elapsed);
            
            setTimeout(() => {
                const preloader = document.getElementById('preloader');
                preloader.style.transform = 'translateY(-100%)';
                
                // Allow interaction and start animation once preloader lifts
                initCarousel();
            }, delay);
        });

        /** Content Data for the 6 Service Cards */
        const services = [
            { 
                title: "Working Capital", 
                color: "#c9a24b", // Gold
                icon: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>` 
            },
            { 
                title: "Overdraft", 
                color: "#10b981", // Emerald
                icon: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 3v18h18M18 9l-5 5-4-4-6 6"/><path d="M18 9h-5M18 9v5"/></svg>`
            },
            { 
                title: "Asset-Based", 
                color: "#3b82f6", // Sapphire
                icon: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M9 9h6M9 13h6M9 17h6"/></svg>`
            },
            { 
                title: "Vehicle Finance", 
                color: "#8b5cf6", // Amethyst
                icon: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M5 10h14l-1.5-4H6.5L5 10zM3 10l1 5h16l1-5M5 15v4a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-4M8 15h.01M16 15h.01"/></svg>`
            },
            { 
                title: "Letter of Credit", 
                color: "#f43f5e", // Ruby
                icon: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 12h6M9 16h6M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`
            },
            { 
                title: "Guarantee", 
                color: "#0ea5e9", // Ocean
                icon: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM12 8v4l3 3"/></svg>`
            }
        ];

        /** Architecture of Carousel Logic */
        let cards = [];
        let baseAngles = [];
        const BASE_ANGLE = -Math.PI / 2; // -90 deg (Top center of the circle)
        const SPACING = 0.45; // Radians space between items
        const TOTAL_SPREAD = SPACING * services.length;
        
        let targetAngleOffset = 0;
        let currentAngleOffset = 0;
        let isPaused = false;
        const animationSpeed = 0.0018;
        let activeCardIndex = -1;

        /** DOM Generation */
        function initCarousel() {
            const arcCenter = document.getElementById('arc-center');
            
            services.forEach((srv, i) => {
                // Determine initial angle spanning around the top center
                baseAngles.push(BASE_ANGLE + (i - (services.length - 1) / 2) * SPACING);
                
                const cardEl = document.createElement('div');
                cardEl.className = 'service-card w-[220px] p-6 rounded-2xl bg-navy-light/70 backdrop-blur-md border border-white/10 shadow-[0_15px_30px_rgba(0,0,0,0.5)] text-center cursor-pointer transition-colors duration-300 hover:bg-[#12284c]/90 select-none';
                cardEl.setAttribute('data-index', i);
                
                cardEl.innerHTML = `
                    <div class="card-icon w-14 h-14 mx-auto rounded-full mb-4 flex items-center justify-center shadow-lg transition-transform duration-300 hover:scale-110 text-white border border-white/20" style="background-color: ${srv.color}">
                        ${srv.icon}
                    </div>
                    <h4 class="text-offwhite font-bold text-lg leading-tight">${srv.title}</h4>
                `;
                
                // Desktop Hover Pauses Loop
                cardEl.addEventListener('mouseenter', () => isPaused = true);
                cardEl.addEventListener('mouseleave', () => isPaused = false);
                
                // Click snaps card to center
                cardEl.addEventListener('click', () => handleCardClick(i, cardEl));
                
                arcCenter.appendChild(cardEl);
                cards.push(cardEl);
            });

            // Fallback for Mobile (Scroll tracking to update folder)
            if (window.innerWidth < 920) {
                setupMobileObserver();
                updateFolder(0); // Initialize first active
            } else {
                requestAnimationFrame(animateLoop);
            }
        }

        /** Interaction logic */
        function handleCardClick(index, cardEl) {
            if (window.innerWidth < 920) {
                // Mobile: Scroll horizontally to view
                cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                updateFolder(index);
            } else {
                // Desktop: Snap carousel to this index mathematically
                let currentRelAngle = (baseAngles[index] + currentAngleOffset - BASE_ANGLE) % TOTAL_SPREAD;
                
                // Normalize angle distance
                if (currentRelAngle > TOTAL_SPREAD / 2) currentRelAngle -= TOTAL_SPREAD;
                if (currentRelAngle < -TOTAL_SPREAD / 2) currentRelAngle += TOTAL_SPREAD;
                
                targetAngleOffset -= currentRelAngle;
                updateFolder(index);
            }
        }

        /** Master update function for the Central Portfolio Book */
        function updateFolder(index) {
            if (activeCardIndex === index) return;
            activeCardIndex = index;
            
            const srv = services[index];
            const folderSvg = document.getElementById('portfolio-folder-svg');
            const chipText = document.getElementById('chip-text');
            const folderTitle = document.getElementById('folder-svg-title');
            const folderIconContainer = document.getElementById('folder-dynamic-icon');
            
            // Mirror color variables
            document.documentElement.style.setProperty('--c', srv.color);
            folderSvg.style.setProperty('--c', srv.color);
            
            // Titles
            folderTitle.textContent = srv.title.toUpperCase();
            chipText.textContent = srv.title;
            
            // Swap SVG Icon Dynamically
            // The icon SVG markup is fetched raw and inserted into the SVG folder namespace
            const rawIcon = srv.icon.replace('stroke="currentColor"', `stroke="${srv.color}"`);
            folderIconContainer.innerHTML = rawIcon;
        }

        /** Smooth Lerping Animation for Desktop Curved Arc */
        function animateLoop() {
            if (window.innerWidth >= 920) {
                if (!isPaused) {
                    targetAngleOffset += animationSpeed;
                }
                
                // Smooth spring-like lerp to the target position
                currentAngleOffset += (targetAngleOffset - currentAngleOffset) * 0.1;
                
                cards.forEach((card, i) => {
                    let angle = baseAngles[i] + currentAngleOffset;
                    let relAngle = angle - BASE_ANGLE;
                    
                    // Seamless wrap-around calculation
                    while (relAngle > TOTAL_SPREAD / 2) relAngle -= TOTAL_SPREAD;
                    while (relAngle < -TOTAL_SPREAD / 2) relAngle += TOTAL_SPREAD;
                    
                    let finalAngle = BASE_ANGLE + relAngle;
                    
                    // Arc geometric properties
                    const radius = window.innerWidth > 1400 ? 800 : 700;
                    const cy = window.innerWidth > 1400 ? 600 : 550; // The Y origin is deep down
                    const cx = window.innerWidth / 2; // X origin is exact center
                    
                    const x = cx + radius * Math.cos(finalAngle);
                    const y = cy + radius * Math.sin(finalAngle);
                    
                    // Fade out & scale down at visual edges to simulate depth / wrapping teleport hiding
                    const distance = Math.abs(relAngle);
                    const opacity = Math.max(0, 1 - distance / 1.1);
                    const scale = Math.max(0.7, 1 - distance / 2.5);
                    
                    card.style.position = 'absolute';
                    card.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;
                    card.style.opacity = opacity;
                    card.style.zIndex = distance < 0.2 ? 60 : 30; // Closer to top = higher Z
                    
                    // Auto-select folder when drifting near absolute top center
                    if (distance < 0.15 && activeCardIndex !== i && !isPaused) {
                        updateFolder(i);
                    }
                });
            }
            
            requestAnimationFrame(animateLoop);
        }

        /** Mobile Scroll Tracking Observer */
        function setupMobileObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
                        const idx = parseInt(entry.target.getAttribute('data-index'));
                        updateFolder(idx);
                    }
                });
            }, { 
                root: document.getElementById('arc-center'), 
                threshold: 0.6 
            });
            
            cards.forEach(card => observer.observe(card));
        }

        // On window resize, if switching modes, enforce layout reset
        window.addEventListener('resize', () => {
            if (window.innerWidth < 920 && cards[0] && cards[0].style.position === 'absolute') {
                cards.forEach(c => {
                    c.style.position = '';
                    c.style.transform = '';
                    c.style.opacity = '1';
                });
                setupMobileObserver();
            }
        });
    </script>
</body>
</html>
